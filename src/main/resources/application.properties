spring.application.name=edufin-backend
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# ===============================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================
spring.datasource.url=${DB_URL:jdbc}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ==========================================
# CONFIGURACIÓN DE CORREO (BREVO API)
# ==========================================
brevo.api-key=${BREVO_API_KEY:}
brevo.from-email=${BREVO_FROM_EMAIL:diego44434@gmail.com}
brevo.from-name=${BREVO_FROM_NAME:Edufin}

# ==========================================
# CONFIGURACIÓN DE JWT
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=172800000

# ==========================================
# CONFIGURACIÓN DE POWER AUTOMATE
# ==========================================
power-automate.api-key=${POWER_AUTOMATE_API_KEY:}

# Permite que Spring Boot sepa que está detrás de un proxy (Railway) y use HTTPS en Swagger
server.forward-headers-strategy=framework

# Esto evita que Tomcat tome el control de los errores y fuerce el HTML
server.error.whitelabel.enabled=false

# Fuerza a Spring MVC a lanzar excepciones para rutas y recursos no encontrados,
# para que el GlobalExceptionHandler las convierta en JSON.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


# ==========================================
# CONFIGURACIÓN DEL MOTOR DE IA (FASTAPI)
# ==========================================
ml.engine.url=${ML_ENGINE_URL:http://localhost:8000/predecir-nivel}
# Versión lógica del checkpoint DKT-Forget usada en snapshots históricos
ml.engine.model-version=${ML_MODEL_VERSION:dkt_forget_pretrained_v1}
